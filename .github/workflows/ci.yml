name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout shared packages
        uses: actions/checkout@v5
        with:
          repository: omnilux-tv/omnilux-packages
          path: shared/omnilux-packages
          ssh-key: ${{ secrets.OMNILUX_PACKAGES_DEPLOY_KEY }}

      - name: Link shared packages
        run: ln -sfn "$GITHUB_WORKSPACE/shared/omnilux-packages" "$GITHUB_WORKSPACE/../omnilux-packages"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install shared package dependencies
        run: pnpm install --frozen-lockfile
        working-directory: shared/omnilux-packages

      - name: Build shared contracts
        run: pnpm --filter @omnilux/types build && pnpm --filter @omnilux/api-contracts build
        working-directory: shared/omnilux-packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint Cloudflare Worker
        run: pnpm lint:worker

      - name: Smoke tests
        run: pnpm test:smoke

      - name: Build
        run: pnpm build

      - name: Build Cloudflare Worker
        run: pnpm build:worker

      - uses: docker/setup-buildx-action@v3

      - name: Build relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            omnilux-packages=./shared/omnilux-packages
          load: true
          platforms: linux/amd64
          tags: omnilux-relay-ci:latest

      - name: Verify relay image artifact
        run: |
          docker run --rm --entrypoint sh omnilux-relay-ci:latest -lc '
            set -eu
            test -f /app/dist/index.js
          '
