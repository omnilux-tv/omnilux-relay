name: Deploy Relay Worker To Staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full immutable commit SHA to deploy to the staging Worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: relay-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.release_sha }}

      - name: Verify immutable release revision
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "${#RELEASE_SHA}" -eq 40

      - name: Checkout shared packages
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: omnilux-tv/omnilux-packages
          ref: 4417465ef7068f0a4576f7028d277e5367388992
          path: shared/omnilux-packages
          ssh-key: ${{ secrets.OMNILUX_PACKAGES_DEPLOY_KEY }}

      - name: Link shared packages
        run: ln -sfn "$GITHUB_WORKSPACE/shared/omnilux-packages" "$GITHUB_WORKSPACE/../omnilux-packages"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install and build shared contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @omnilux/types build
          pnpm --filter @omnilux/api-contracts build
        working-directory: shared/omnilux-packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact staging artifact
        run: pnpm test:release-config && pnpm lint:worker && pnpm test:worker-smoke && pnpm build:worker:staging

      - name: Deploy immutable staging revision
        run: pnpm exec wrangler deploy --config wrangler.staging.jsonc --strict --tag "$RELEASE_SHA" --message "staging release $RELEASE_SHA"

      - name: Probe staging readiness
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 https://relay-test.omnilux.tv/readyz

      - name: Capture staging version evidence
        run: |
          pnpm exec wrangler versions list --config wrangler.staging.jsonc --json > worker-staging-versions.json
          node scripts/verify-worker-deployment-evidence.mjs \
            --versions worker-staging-versions.json \
            --release-sha "$RELEASE_SHA" \
            > worker-staging-release-evidence.json
          pnpm exec wrangler deployments list --config wrangler.staging.jsonc --json > worker-staging-deployments.json

      - name: Upload staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-worker-staging-${{ inputs.release_sha }}
          path: |
            worker-staging-release-evidence.json
            worker-staging-versions.json
            worker-staging-deployments.json
          if-no-files-found: error
